<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - ERPs</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 600px; margin: 40px auto; padding: 20px; background: #1A202C; border-radius: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--primary-green); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-white); }
        .form-group textarea { height: 150px; }
        .submit-btn { background-color: var(--primary-green); color: var(--bg-color); padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .submit-btn:hover { background-color: #02a384; }
        #statusMessage { margin-top: 15px; text-align: center; color: var(--text-gray); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Azos soft House (Admin)</div>
        <nav class="nav">
            <a href="/">← Voltar para o site</a>
        </nav>
    </header>

    <div class="admin-container">
        <h2>Gerenciar ERPs</h2>

        <div class="form-group">
            <label for="erpSelect">Selecione um ERP para editar/remover (ou deixe vazio para criar um novo)</label>
            <select id="erpSelect" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-white); margin-bottom: 20px;">
                <option value="">-- Criar Novo ERP --</option>
            </select>
            <button id="deleteBtn" class="submit-btn" style="background-color: #e53e3e; display: none; margin-bottom: 20px;">Remover ERP Selecionado</button>
        </div>
        <hr style="border: 1px solid var(--border-color); margin-bottom: 20px;">

        <h2 id="formTitle">Cadastrar Novo ERP</h2>
        <form id="erpForm">
            <div class="form-group">
                <label for="erpName">Nome do ERP (Ex: SGP, IXC)</label>
                <input type="text" id="erpName" name="name" required>
            </div>

            <div class="form-group">
                <label for="erpTitle">Título do Passo a Passo</label>
                <input type="text" id="erpTitle" name="title" placeholder="Ex: SGP — Passo a passo" required>
            </div>

            <div class="form-group">
                <label for="erpMessage">Corpo do Texto (Você pode usar tags HTML como &lt;p&gt; e &lt;strong&gt;)</label>
                <textarea id="erpMessage" name="message" required></textarea>
            </div>

            <div class="form-group">
                <label for="erpImage">Imagem do Tutorial</label>
                <input type="file" id="erpImage" name="image" accept="image/*">
            </div>

            <button type="submit" class="submit-btn">Salvar Configuração</button>
            <p id="statusMessage"></p>
        </form>
    </div>

    <script src="admin.js"></script>
</body>
</html>
